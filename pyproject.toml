[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-portfolio"
version = "0.1.0"
description = "MOEX portfolio optimizer: correlation graph, Markowitz, Black-Litterman, HRP, ML forecasting, multi-asset, bonds, stress testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "requests>=2.31",
    "aiohttp>=3.9",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "rich>=13.4",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "python-dateutil>=2.8",
    "flaml[automl]>=2.3,<2.6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["moex_portfolio"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "C408",   # dict() calls — idiomatic in Plotly
    "DTZ011", # date.today() — intentional in config
    "RUF002", # Cyrillic in docstrings — project is in Russian
    "RUF003", # Cyrillic in comments — project is in Russian
    "E501",   # line too long — cosmetic
]
select = ["E", "F", "W", "I", "C4"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B405", "B314"]  # xml.etree.ElementTree — parsing trusted CBR XML only
