[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moex-portfolio"
version = "0.1.0"
description = "Optimal MOEX portfolio construction using correlation graph analysis and Markowitz optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "requests>=2.31",
    "scipy>=1.11",
    "tqdm>=4.65",
    "rich>=13.4",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
